<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 352" width="1200" height="352" role="img" aria-labelledby="workflow-title workflow-desc"><title id="workflow-title">From your catalog to your app</title><desc id="workflow-desc">Your CoreGlyphs catalog is decoded by @opensymbols/decode, turned by opensymbols generate into a private icon package of format 2 modules, one per symbol, which your app renders with @opensymbols/react and, optionally, @opensymbols/animate. opensymbols gate checks the decoder and opensymbols demo previews the package. The catalog and the package stay on your machine: no Apple data enters the repository or npm.</desc><defs><linearGradient id="workflow-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2066"/><stop offset=".55" stop-color="#0c0e2b"/></linearGradient><pattern id="workflow-g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#8b95e0" stroke-opacity=".07" stroke-width="1"/></pattern><pattern id="workflow-G" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#8b95e0" stroke-opacity=".14" stroke-width="1"/></pattern></defs><style>.name{font:600 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#e3e7ff} .sub{font:500 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#9ca5d4;letter-spacing:.08em}.eyebrow{font:500 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#8b95e0;letter-spacing:.14em}.title{font:600 15px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#e3e7ff} .body{font:400 12px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#9ca5d4} .code{font:400 11.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#9ca5d4}.big{font:600 24px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#e3e7ff} .label{font:600 13px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#e3e7ff}.sub.focal{fill:#e8954a} .sub.blue{fill:#6ca4f8}</style><rect width="1200" height="352" rx="10" fill="url(#workflow-bg)"/><rect width="1200" height="352" rx="10" fill="url(#workflow-g)"/><rect width="1200" height="352" rx="10" fill="url(#workflow-G)"/><rect x=".5" y=".5" width="1199" height="351" rx="10" fill="none" stroke="#8b95e0" stroke-opacity=".35"/><text class="eyebrow" x="24" y="30">FIG. 1  FROM YOUR CATALOG TO YOUR APP</text><rect x="24" y="52" width="208" height="112" rx="6" fill="#151a45"/><rect x="24" y="52" width="208" height="112" rx="6" fill="#e8954a" fill-opacity=".12"/><rect x="24" y="52" width="208" height="112" rx="6" fill="none" stroke="#e8954a" stroke-opacity=".8" stroke-width="1.2"/><text class="sub focal" x="40" y="76">01</text><text class="sub focal" x="218" y="76" text-anchor="end">APPLE DATA</text><text class="title" x="40" y="98">Your catalog</text><text class="code" x="40" y="120">CoreGlyphs Assets.car</text><text class="code" x="40" y="136">plists and .strings</text><text class="code" x="40" y="152">optional app/ metadata</text><line x1="234" y1="108.0" x2="251" y2="108.0" stroke="#9ca5d4" stroke-width="1.2"/><path d="M258 108.0 L250 104.0 L250 112.0 Z" fill="#9ca5d4"/><rect x="260" y="52" width="208" height="112" rx="6" fill="#151a45"/><rect x="260" y="52" width="208" height="112" rx="6" fill="#6ca4f8" fill-opacity=".07"/><rect x="260" y="52" width="208" height="112" rx="6" fill="none" stroke="#6ca4f8" stroke-opacity=".8" stroke-width="1.2"/><text class="sub blue" x="276" y="76">02</text><text class="sub blue" x="454" y="76" text-anchor="end">MIT CODE</text><text class="title" x="276" y="98">@opensymbols/decode</text><text class="body" x="276" y="120">BOM store and CAR</text><text class="body" x="276" y="136">BVG paths and styles</text><text class="body" x="276" y="152">a drawing per master</text><line x1="470" y1="108.0" x2="487" y2="108.0" stroke="#9ca5d4" stroke-width="1.2"/><path d="M494 108.0 L486 104.0 L486 112.0 Z" fill="#9ca5d4"/><rect x="496" y="52" width="208" height="112" rx="6" fill="#151a45"/><rect x="496" y="52" width="208" height="112" rx="6" fill="#6ca4f8" fill-opacity=".07"/><rect x="496" y="52" width="208" height="112" rx="6" fill="none" stroke="#6ca4f8" stroke-opacity=".8" stroke-width="1.2"/><text class="sub blue" x="512" y="76">03</text><text class="sub blue" x="690" y="76" text-anchor="end">MIT CODE</text><text class="title" x="512" y="98">opensymbols generate</text><text class="body" x="512" y="120">format 2, delta-encoded</text><text class="body" x="512" y="136">one module per symbol</text><text class="code" x="512" y="152">index.json, symbol.d.ts</text><line x1="706" y1="108.0" x2="723" y2="108.0" stroke="#9ca5d4" stroke-width="1.2"/><path d="M730 108.0 L722 104.0 L722 112.0 Z" fill="#9ca5d4"/><rect x="732" y="52" width="208" height="112" rx="6" fill="#151a45"/><rect x="732" y="52" width="208" height="112" rx="6" fill="#e8954a" fill-opacity=".12"/><rect x="732" y="52" width="208" height="112" rx="6" fill="none" stroke="#e8954a" stroke-opacity=".8" stroke-width="1.2"/><text class="sub focal" x="748" y="76">04</text><text class="sub focal" x="926" y="76" text-anchor="end">APPLE DATA</text><text class="title" x="748" y="98">Your icon package</text><text class="body" x="748" y="120">private, ESM</text><text class="code" x="748" y="136">symbols/&lt;Component&gt;.js</text><text class="body" x="748" y="152">never published</text><line x1="942" y1="108.0" x2="959" y2="108.0" stroke="#9ca5d4" stroke-width="1.2"/><path d="M966 108.0 L958 104.0 L958 112.0 Z" fill="#9ca5d4"/><rect x="968" y="52" width="208" height="112" rx="6" fill="#151a45"/><rect x="968" y="52" width="208" height="112" rx="6" fill="#c9cff5" fill-opacity=".07"/><rect x="968" y="52" width="208" height="112" rx="6" fill="none" stroke="#c9cff5" stroke-opacity=".8" stroke-width="1.2"/><text class="sub" x="984" y="76">05</text><text class="sub" x="1162" y="76" text-anchor="end">YOUR CODE</text><text class="title" x="984" y="98">Your app</text><text class="code" x="984" y="120">@opensymbols/react</text><text class="code" x="984" y="136">+ @opensymbols/animate</text><text class="code" x="984" y="152">import Wifi from …</text><line x1="364.0" y1="166" x2="364.0" y2="202" stroke="#9ca5d4" stroke-width="1.2" stroke-dasharray="4,3"/><circle cx="364.0" cy="166" r="2.5" fill="#9ca5d4"/><rect x="222.0" y="204" width="284" height="70" rx="6" fill="#151a45"/><rect x="222.0" y="204" width="284" height="70" rx="6" fill="none" stroke="#c9cff5" stroke-opacity=".45" stroke-width="1" stroke-dasharray="5,3"/><text class="title" x="238.0" y="228" style="font-size:14px">opensymbols gate</text><text class="body" x="238.0" y="248">decode every drawing, check the masters</text><text class="body" x="238.0" y="264">exit 0 only with no failure</text><line x1="836.0" y1="166" x2="836.0" y2="202" stroke="#9ca5d4" stroke-width="1.2" stroke-dasharray="4,3"/><circle cx="836.0" cy="166" r="2.5" fill="#9ca5d4"/><rect x="694.0" y="204" width="284" height="70" rx="6" fill="#151a45"/><rect x="694.0" y="204" width="284" height="70" rx="6" fill="none" stroke="#c9cff5" stroke-opacity=".45" stroke-width="1" stroke-dasharray="5,3"/><text class="title" x="710.0" y="228" style="font-size:14px">opensymbols demo</text><text class="body" x="710.0" y="248">browse and preview the package</text><text class="body" x="710.0" y="264">served on 127.0.0.1:4173</text><line x1="24" y1="288" x2="1176" y2="288" stroke="#8b95e0" stroke-opacity=".3"/><rect x="24" y="299" width="10" height="10" rx="2" fill="#e8954a"/><text class="body" x="42" y="308"><tspan fill="#e3e7ff" font-weight="600">Apple data stays on your machine.</tspan> No catalog, drawing or generated package enters this repository or npm.</text><rect x="24" y="323" width="10" height="10" rx="2" fill="#6ca4f8"/><text class="body" x="42" y="332"><tspan fill="#e3e7ff" font-weight="600">MIT code</tspan> is all the repository and its packages ship: the decoder, the generator, the runtime and the effects.</text></svg>
